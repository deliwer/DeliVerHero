# Nginx configuration for subpath deployment
# Add this to your main nginx server block for www.deliwer.com

# SPA routing for /pakistan-mission subpath
location /pakistan-mission/ {
    # Try to serve the file, directory, or fall back to index.html
    try_files $uri $uri/ /pakistan-mission/index.html;
}

# Cache static assets (JS, CSS, images) for 1 year
location ~* \.(?:js|css|svg|gif|png|jpg|jpeg|webp|woff|woff2|ttf|eot|ico)$ {
    # Only apply if under pakistan-mission path
    if ($uri ~* ^/pakistan-mission/) {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    try_files $uri =404;
}

# No cache for index.html to ensure updates are immediately visible
location = /pakistan-mission/index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    add_header Pragma "no-cache";
    add_header Expires "0";
}

